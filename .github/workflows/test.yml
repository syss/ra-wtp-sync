name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all scripts
        run: python -m py_compile ra_wtp_sync.py ra_wtp_gui.py setup.py
      - name: Unit tests
        run: python tests/run_ci.py
      - name: CLI smoke test (console list works offline)
        run: python ra_wtp_sync.py --list-consoles --state-dir ci-state
