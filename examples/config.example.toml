# Copy to config.toml next to ra_wtp_sync.py (git-ignored) - or into your user config folder
# (see README) - and adjust. Paths work with / on every OS; on Windows both C:/roms and C:\\roms
# (doubled backslashes inside quotes) are fine.
# Every key can also be given on the command line (see `ra-wtp-sync --help`).

username = "YourRAUsername"

# Your RetroAchievements Web API key: https://retroachievements.org/settings -> Keys
# Either export RA_API_KEY, or put the key (only the key) in this file (chmod 600).
# Default: "api_key" in your user config folder. A relative path is resolved next to the script.
# api_key_file = "api_key"

# Your ROM library. Opened read-only; nothing is ever written, moved or deleted here.
src = "/path/to/roms"

# Output folder. It is owned by this tool: one sub-folder per system, and only files
# this tool copied are ever deleted. Point your Syncthing/other sync folder at it.
dest = "/path/to/synced-folder/roms-wtp"

# Where the hash cache and the manifest live (not synced).
# state_dir = "/path/to/state"   # default: per-user state folder (see README)

# Folders with existing save files (RetroArch "saves" dir, searched recursively).
# If several ROMs would work, the one that already has a save is chosen first.
saves = []

# Also keep games you started but have not beaten yet (default: only Want to Play).
include_started = false

# Systems to handle: keys, RetroAchievements console ids, or ["all"]. List them with
#   python ra_wtp_sync.py --list-consoles
# Cartridge systems are matched by RA hash. Disc based and other systems (psx, ps2, gamecube,
# wii, nds, 3ds, saturn, dreamcast, psp, arcade, ...) are matched by game title instead, and
# their files can be very large - select them deliberately.
consoles = ["n64", "snes", "nes", "gb", "gbc", "gba", "megadrive", "mastersystem"]
# Handy with "all": leave some out.
exclude_consoles = []

# Missing-ROMs report: every game on your list that could not be provided, with the reason
# (not in the library / patch needs a base ROM you lack / unsupported patch format ...).
# report_file = "/path/to/missing-roms.txt"   # default: <state_dir>/missing-roms.txt

# Build missing hacks from RetroAchievements' official patches (RAPatches repo; IPS/BPS/UPS)
# using base ROMs from your library. Built ROMs are kept in patched_dir.
build_patches = true
# patched_dir = "/path/to/patched"            # default: <state_dir>/patched

# Skip ROM files larger than this (MB) while hashing.
max_rom_mb = 200

# How long RA hash lists are cached.
hash_cache_days = 7

# Safety net: if the RA list shrinks below this fraction of what is already synced
# (API outage, wrong username, ...), nothing is deleted.
min_list_fraction = 0.5

# When several ROMs in your library match RA's hashes, ONE is picked. The first
# criterion in `order` that distinguishes them decides.
[preferences]
order = ["save", "qol", "language", "region", "revision"]
# save     a ROM that already has a save file in `saves`
# qol      names that look like quality-of-life / fixed / enhanced versions
# language languages = [...]  e.g. ["de", "en"]   (de fr es it ja en)
# region   regions   = [...]  e.g. ["europe", "usa"]   (europe usa japan world)
# revision highest "Rev X" / "v1.x" / PRG number
languages = ["en"]
regions = ["europe", "usa"]

# Your library uses other folder names? Map them (matched case-insensitively
# below `src`). You can also define systems that are not built in.
# [console_overrides.n64]
# dirs = ["Nintendo 64", "n64-hacks"]
#
# [console_overrides.mysystem]
# id = 99          # RetroAchievements console id
# hash = "plain"   # plain | nes | snes | n64
# dirs = ["mysystem"]
